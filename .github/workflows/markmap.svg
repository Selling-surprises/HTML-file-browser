<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1976D2"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#388E3C"/>
    </marker>
    <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7B1FA2"/>
    </marker>
    <marker id="arrowhead-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F57C00"/>
    </marker>
    <marker id="arrowhead-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0097A7"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="900" height="700" fill="#fafafa"/>

  <!-- 标题 -->
  <text x="450" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#333">
    📂 HTML 文件浏览器 - 工作流程图
  </text>

  <!-- 阶段一标题 -->
  <text x="225" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1565C0">
    🔄 阶段一：GitHub Actions 自动生成
  </text>

  <!-- 阶段二标题 -->
  <text x="675" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#E65100">
    🌐 阶段二：用户访问流程
  </text>

  <!-- 阶段一：左侧流程 -->
  <!-- 开发者推送 -->
  <rect x="50" y="100" width="140" height="60" rx="10" fill="#E3F2FD" stroke="#333" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">👨‍💻</text>
  <text x="120" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">开发者推送</text>
  <text x="120" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">HTML文件</text>

  <!-- GitHub仓库 -->
  <rect x="220" y="100" width="140" height="60" rx="10" fill="#E8F5E9" stroke="#333" stroke-width="2"/>
  <text x="290" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📁</text>
  <text x="290" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">GitHub</text>
  <text x="290" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">代码仓库</text>

  <!-- Actions触发 -->
  <rect x="390" y="100" width="140" height="60" rx="10" fill="#F3E5F5" stroke="#333" stroke-width="2"/>
  <text x="460" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">⚡</text>
  <text x="460" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">Actions</text>
  <text x="460" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">工作流触发</text>

  <!-- 扫描目录 -->
  <rect x="390" y="190" width="140" height="60" rx="10" fill="#F3E5F5" stroke="#333" stroke-width="2"/>
  <text x="460" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🔍</text>
  <text x="460" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">扫描 html/</text>
  <text x="460" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">目录文件</text>

  <!-- 生成JSON -->
  <rect x="390" y="280" width="140" height="60" rx="10" fill="#E0F7FA" stroke="#333" stroke-width="2"/>
  <text x="460" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📋</text>
  <text x="460" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">生成</text>
  <text x="460" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">filelist.json</text>

  <!-- GitHub Pages部署 -->
  <rect x="220" y="280" width="140" height="60" rx="10" fill="#E8F5E9" stroke="#333" stroke-width="2"/>
  <text x="290" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🚀</text>
  <text x="290" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">GitHub Pages</text>
  <text x="290" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">自动部署</text>

  <!-- 阶段一箭头 -->
  <line x1="190" y1="130" x2="220" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="360" y1="130" x2="390" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="160" x2="460" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="460" y1="250" x2="460" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="390" y1="310" x2="360" y2="310" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 阶段二：右侧流程 -->
  <!-- 用户访问 -->
  <rect x="620" y="100" width="140" height="60" rx="10" fill="#E3F2FD" stroke="#333" stroke-width="2"/>
  <text x="690" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">🧑‍💻</text>
  <text x="690" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">用户访问</text>
  <text x="690" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">浏览器页面</text>

  <!-- 加载index.html -->
  <rect x="620" y="190" width="140" height="60" rx="10" fill="#FFF3E0" stroke="#333" stroke-width="2"/>
  <text x="690" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📄</text>
  <text x="690" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">加载</text>
  <text x="690" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">index.html</text>

  <!-- 显示加载动画 -->
  <rect x="620" y="280" width="140" height="60" rx="10" fill="#FFF3E0" stroke="#333" stroke-width="2"/>
  <text x="690" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">⏳</text>
  <text x="690" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">显示加载动画</text>
  <text x="690" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">(Spinner)</text>

  <!-- 请求JSON -->
  <rect x="620" y="370" width="140" height="60" rx="10" fill="#FFF3E0" stroke="#333" stroke-width="2"/>
  <text x="690" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📡</text>
  <text x="690" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">fetch()</text>
  <text x="690" y="428" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">请求filelist.json</text>

  <!-- 接收JSON -->
  <rect x="620" y="460" width="140" height="60" rx="10" fill="#E0F7FA" stroke="#333" stroke-width="2"/>
  <text x="690" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">✅</text>
  <text x="690" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">接收JSON</text>
  <text x="690" y="518" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">解析数据</text>

  <!-- 渲染列表 -->
  <rect x="620" y="550" width="140" height="60" rx="10" fill="#FFF3E0" stroke="#333" stroke-width="2"/>
  <text x="690" y="575" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold">📑</text>
  <text x="690" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">渲染文件</text>
  <text x="690" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="10">列表UI</text>

  <!-- 阶段二箭头 -->
  <line x1="690" y1="160" x2="690" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="250" x2="690" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="340" x2="690" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="430" x2="690" y2="460" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="690" y1="520" x2="690" y2="550" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- 连接部署到用户访问（虚线） -->
  <line x1="360" y1="310" x2="620" y2="310" stroke="#999" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <text x="490" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">部署完成</text>

  <!-- 底部功能区域 -->
  <text x="450" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#C62828">
    ⚠️ 错误处理
  </text>

  <!-- 错误处理框 -->
  <rect x="350" y="440" width="120" height="50" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="410" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">❌ 网络错误</text>
  <text x="410" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">显示提示</text>

  <rect x="350" y="510" width="120" height="50" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="410" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">📭 文件不存在</text>
  <text x="410" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">显示空状态</text>

  <!-- 错误处理箭头（虚线） -->
  <line x1="620" y1="400" x2="470" y2="400" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="410" y1="490" x2="410" y2="510" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <text x="225" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E7D32">
    🎮 用户交互功能
  </text>

  <!-- 交互功能框 -->
  <rect x="165" y="440" width="120" height="50" rx="8" fill="#E3F2FD" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="225" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">🔍 实时搜索</text>
  <text x="225" y="475" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">过滤文件</text>

  <rect x="165" y="510" width="120" height="50" rx="8" fill="#E3F2FD" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="225" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold">🖱️ 点击文件</text>
  <text x="225" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="9">新窗口打开</text>

  <!-- 交互箭头（虚线） -->
  <line x1="620" y1="580" x2="285" y2="580" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>
  <line x1="225" y1="490" x2="225" y2="510" stroke="#999" stroke-width="1.5" stroke-dasharray="5,5" marker-end="url(#arrowhead)"/>

  <!-- 图例 -->
  <text x="50" y="650" font-family="Arial, sans-serif" font-size="10" font-weight="bold">图例:</text>

  <rect x="90" y="635" width="20" height="20" fill="#E3F2FD" stroke="#333" stroke-width="1"/>
  <text x="115" y="650" font-family="Arial, sans-serif" font-size="9">用户操作</text>

  <rect x="180" y="635" width="20" height="20" fill="#FFF3E0" stroke="#333" stroke-width="1"/>
  <text x="205" y="650" font-family="Arial, sans-serif" font-size="9">浏览器/前端</text>

  <rect x="290" y="635" width="20" height="20" fill="#E8F5E9" stroke="#333" stroke-width="1"/>
  <text x="315" y="650" font-family="Arial, sans-serif" font-size="9">GitHub服务</text>

  <rect x="400" y="635" width="20" height="20" fill="#F3E5F5" stroke="#333" stroke-width="1"/>
  <text x="425" y="650" font-family="Arial, sans-serif" font-size="9">Actions工作流</text>

  <rect x="520" y="635" width="20" height="20" fill="#E0F7FA" stroke="#333" stroke-width="1"/>
  <text x="545" y="650" font-family="Arial, sans-serif" font-size="9">JSON数据</text>

  <text x="650" y="650" font-family="Arial, sans-serif" font-size="9" fill="#666">—— 主流程    - - - 分支/交互</text>
</svg>